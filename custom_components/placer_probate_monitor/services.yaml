run_now:
  name: Run now
  description: Scrape CNPA/eCourt and send the digest using the configured schedule settings.
test_email:
  name: Send test email
  description: Send a test message with the configured SMTP settings and recipients.
verify_fub:
  name: Verify one FUB import
  description: Scrape as usual, then import only the first go-case that has never been sent to Follow Up Boss. Does not email.
preview_one:
  name: Preview one record
  description: Retrieve one live go-case for display only. Ignores local seen/FUB status. Does not post to Follow Up Boss or update seen-cases.
