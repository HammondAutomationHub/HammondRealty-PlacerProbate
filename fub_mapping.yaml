# Follow Up Boss field mapping for Placer Probate Monitor.
# Edit keys to match custom fields created in the FUB account.
# Do not map attorney_phone onto person.phones.

system: PlacerProbateMonitor
court_search_url: "https://webportal.placerco.org/eCourtPublic/?q=node/48"
subject_address_type: "subject property"

# Names skipped even if they pass the hard gate (case-insensitive substring).
skip_petitioner_contains:
  - public administrator

# Custom field API names (create these in FUB, then keep names in sync).
custom_fields:
  petitioner_first: firstName
  petitioner_last: lastName
  mailing_address: addresses
  petitioner_email: emails
  petitioner_phone: phones
  decedent_residence: address2

# Person fields we send vs skip.
send:
  firstName: true
  lastName: true
  emails: true
  phones: true
  subject_property_address: true
  mailing_address: true
  assignedTo: true
  source: true
  message: true
  custom_fields: true
